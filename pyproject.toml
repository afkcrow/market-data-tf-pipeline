[project]
name = "market-data-tf-pipeline"
version = "0.1.0"
description = "Modular CCXT + TensorFlow market data pipeline"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.0.0",
    "tensorflow>=2.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
