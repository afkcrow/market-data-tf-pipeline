[project]
name = "market-data-tf-pipeline"
version = "0.1.0"
description = "Modular CCXT + TensorFlow market data pipeline"
requires-python = ">=3.12"          # ← changed this
dependencies = [
    "ccxt>=4.0.0",
    "tensorflow>=2.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
